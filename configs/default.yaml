# Global defaults used by CLI/training
seed: 42
cv_splits: 5
scale_mode: 0
threshold: 0.5
test_size: 0.2
repeats: 100
steps:
  total_steps: 500
  early_stopping: 50

# Model default hyperparameters
model_defaults:
  xgboost_vanilla:
    objective: binary:logistic
    eval_metric: auc
    tree_method: hist
    device: cuda
    eta: 0.05
    max_depth: 4
    min_child_weight: 3
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 3.0
    reg_alpha: 0.0
    max_delta_step: 1
    n_estimators: 400
    verbosity: 0
    nthread: 8
  svm:
    C: 1.0
    kernel: rbf
    gamma: scale
    class_weight: balanced
    probability: true
  mlp:
    hidden_layer_sizes: 128
    activation: relu
    solver: adam
    alpha: 0.0001
    batch_size: auto
    learning_rate: constant
    learning_rate_init: 0.001
    max_iter: 1000
    early_stopping: true
    shuffle: true
    random_state: 42

# Method defaults
method_defaults:
  cr:
    cr_alpha: 0.05

# KMM defaults (used for prefit/apply)
kmm_defaults:
  kernel: rbf
  B: 1000.0
  eps: null
  max_size: 1000
  gamma: null
  clip_min: 0.0
  clip_max: 50.0
