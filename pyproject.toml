[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-and-fair-ml-for-adrd"
version = "0.2.0"
description = "Explainable and fair ML pipeline for ADRD classification"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "xgboost>=1.7",
  "joblib>=1.2",
  "pyyaml>=6.0",
  "shap>=0.41",
  "tqdm>=4.64",
  "cvxopt>=1.3",
  "torch>=2.0",
]

[project.optional-dependencies]
adapt = ["adapt>=0.4.4"]

[project.scripts]
dai = "dementia_ai.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dementia_ai*"]
exclude = ["logs", "configs", "results", "notebooks", "scripts"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"dementia_ai" = ["configs/*.yaml"]
